name: Deploy Vue to GitHub Pages

on:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build ezcruise
        run: |
          npm install
          cd ezcruise
          npm install && npm run build
          cd ..
          mkdir -p deploy/ezcruise
          cp -r ezcruise/dist/* deploy/ezcruise/


      - name: Upload artifact
        uses: [actions/upload-pages-artifact](https://github.com)@v3
        with:
          path: './deploy' # Ensure this matches your Vite build output directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: [actions/deploy-pages](https://github.com/actions/deploy-pages)@v4
